# Bootstrap only: serve ACME challenges without exposing the HTTP API.
# Replace api.example.com with your real DNS hostname before installing.
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://api.example.com$request_uri;
    }
}

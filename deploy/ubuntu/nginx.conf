# Ubuntu includes sites-enabled files inside its http {} context.
# Replace api.example.com everywhere, including certificate paths.
limit_req_zone $binary_remote_addr zone=courier_hub_per_ip:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://api.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.example.com;

    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CourierHubTLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 64k;
    client_body_timeout 15s;
    limit_req zone=courier_hub_per_ip burst=20 nodelay;
    limit_req_status 429;

    access_log /var/log/nginx/courier-hub.access.log;
    error_log /var/log/nginx/courier-hub.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        proxy_next_upstream off;
    }
}
